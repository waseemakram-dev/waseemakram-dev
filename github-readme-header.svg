<linearGradient id="line" x1="105" y1="0" x2="1095" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#155E39" stop-opacity="0"/><stop offset=".5" stop-color="#20836F"/><stop offset="1" stop-color="#155E39" stop-opacity="0"/></linearGradient>
