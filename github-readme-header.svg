<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Waseem Akram — Full-Stack SaaS Engineer</title><desc id="desc">Branded profile header in deep pine, emerald and mint.</desc>
<defs>
